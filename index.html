<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RePurpose Hub — Give unwanted items a second life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap topbar">
    <button class="brand" data-go="home" aria-label="RePurpose Hub, go to home">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
      </span>
      RePurpose Hub
    </button>
    <nav class="main" id="nav" aria-label="Main">
      <button data-go="home">Home</button>
      <button data-go="browse">Browse items</button>
      <button data-go="post">Post an item</button>
      <button data-go="ideas">New purpose</button>
      <button data-go="impact">Impact</button>
      <button data-go="dashboard">Dashboard</button>
    </nav>
    <span class="spacer"></span>
    <div class="top-actions">
      <button class="icon-btn menu-toggle" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <span id="authSlot"></span>
    </div>
  </div>
</header>

<main id="main"></main>

<footer class="site">
  <div class="wrap foot-grid">
    <div>RePurpose Hub — an EVS software prototype. Don't throw it away. Give it another purpose.</div>
    <div>Demo build · data is stored in your browser only</div>
  </div>
</footer>

<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<script src="js/app.js"></script>
<script src="js/firebase-backend.js"></script>
</body>
</html>
